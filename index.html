<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pico OS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/644/644667.png">
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <div class="icon" style="font-size:3rem; margin-bottom:20px; color:var(--primary)">
                <i class="fa-solid fa-microchip"></i>
            </div>
            <h2>Pico OS</h2>
            <p style="color:var(--text-sec); margin-bottom:20px">Identifícate</p>
            
            <input type="text" id="user-input" placeholder="Usuario" autocomplete="off">
            <input type="password" id="pass-input" placeholder="Contraseña">
            
            <button class="btn-action" id="btn-login" style="margin-top:20px">ENTRAR</button>
        </div>
    </div>

    <div id="main-interface" style="display:none; width:100%; max-width:1600px; display:flex; flex-direction:column; align-items:center;">
        
        <header>
            <div class="header-left">
                <div class="pico-status" id="pico-status-container">
                    <div class="pico-info-pill">
                        <i class="fa-solid fa-microchip"></i>
                        <span id="pico-temp">--°C</span>
                        <span style="opacity:0.3">|</span>
                        <span id="pico-ram">--%</span>
                    </div>
                </div>

                <div class="broker-wrapper" id="broker-trigger">
                    <div class="dot green" id="broker-dot"></div>
                    <span id="broker-name">Conectado</span>
                    <i class="fa-solid fa-chevron-down" style="font-size:0.7rem; opacity:0.5"></i>
                    
                    <div class="custom-dropdown" id="broker-menu">
                        <div class="dropdown-item" data-broker="wss://broker.hivemq.com:8884/mqtt">HiveMQ (Public)</div>
                        <div class="dropdown-item" data-broker="wss://test.mosquitto.org:8081">Mosquitto (Public)</div>
                    </div>
                </div>
            </div>

            <div class="header-right">
                <div class="broker-wrapper" id="settings-trigger" style="width:40px; justify-content:center; padding:5px;">
                    <i class="fa-solid fa-gear" style="font-size:1.1rem; color:var(--text-sec)"></i>
                    
                    <div class="custom-dropdown" id="settings-menu" style="left:auto; right:0; top:120%; min-width:180px;">
                        <div class="dropdown-item" id="btn-edit">
                            <i class="fa-solid fa-pen-ruler" style="width:20px"></i> Editar Diseño
                        </div>
                        <div class="dropdown-item" id="btn-theme">
                            <i class="fa-solid fa-moon" style="width:20px"></i> Tema Oscuro
                        </div>
                        <div class="dropdown-item" id="btn-logout" style="color:#ff453a; border-top:1px solid var(--border); margin-top:5px;">
                            <i class="fa-solid fa-right-from-bracket" style="width:20px"></i> Cerrar Sesión
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="grid" id="grid"></div>

    </div>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script type="module" src="core.js"></script>
</body>
</html>
