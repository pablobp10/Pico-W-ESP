<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Pico OS</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <script>
        (function() {
            const logs = [];
            window.addEventListener('DOMContentLoaded', () => {
                document.body.insertAdjacentHTML('beforeend', `
                    <div id="mobile-dev-console" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); font-family:monospace; font-size:12px; z-index:99999; padding:40px 10px 10px 10px; box-sizing:border-box; overflow-y:auto; backdrop-filter:blur(5px);">
                        <button onclick="document.getElementById('mobile-dev-console').style.display='none'" style="position:fixed; top:10px; right:10px; background:#ff453a; color:white; border:none; padding:8px 15px; border-radius:5px; font-weight:bold; box-shadow:0 4px 6px rgba(0,0,0,0.3);">CERRAR</button>
                        <h3 style="color:#32d74b; margin-top:0; border-bottom:1px solid #333; padding-bottom:10px;">>_ Terminal de Depuración</h3>
                        <div id="mobile-dev-logs"></div>
                    </div>
                    <button onclick="document.getElementById('mobile-dev-console').style.display='block'" style="position:fixed; bottom:20px; right:20px; background:#1c1c1e; border:1px solid #333; color:white; padding:12px; border-radius:50%; z-index:99998; box-shadow:0 4px 10px rgba(0,0,0,0.5);">🐛</button>
                `);
                const logContainer = document.getElementById('mobile-dev-logs');
                logs.forEach(l => logContainer.innerHTML += `<div style="margin-bottom:5px; border-bottom:1px solid #222; padding-bottom:5px; word-wrap:break-word;">${l}</div>`);
            });

            window.saveLog = function (msg, color) {
                const str = `<span style="color:${color}">${msg}</span>`;
                logs.push(str);
                const container = document.getElementById('mobile-dev-logs');
                if (container) {
                    container.innerHTML += `<div style="margin-bottom:5px; border-bottom:1px solid #222; padding-bottom:5px; word-wrap:break-word;">${str}</div>`;
                    container.parentElement.scrollTop = container.parentElement.scrollHeight;
                }
            }

            const oLog = console.log, oErr = console.error, oWarn = console.warn;
            console.log = function(...a) { saveLog(a.join(" "), "#ffffff"); oLog.apply(console, a); };
            console.warn = function(...a) { saveLog(a.join(" "), "#ffcc00"); oWarn.apply(console, a); };
            console.error = function(...a) { saveLog(a.join(" "), "#ff453a"); oErr.apply(console, a); };

            window.onerror = function(msg, url, line) {
                saveLog(`💥 ERROR: ${msg} | ${line}`, "#ff453a");
                return false;
            };
        })();
    </script>
</head>

<body>
    <script type="module">
        import { Core } from './core.js';
    
        // Función de arranque seguro
        async function ignicion() {
            console.log("🛠️ DOM detectado. Iniciando Core...");
            window.App = new Core();
        
            // Cargamos las librerías dinámicamente en RAM
            if (window.App.inicializarModulos) {
                await window.App.inicializarModulos();
            }
        
            // Una vez cargado Paho, Crypto y el HTML, lanzamos el sistema
            window.App.init(); 
        }

        // Solo arranca cuando el HTML esté 100% listo
        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', ignicion);
        } else {
            ignicion();
        }
    </script>


    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(() => {
                    console.log('Motor PWA activado.');
                });
            });
        }
    </script>
</body>
</html>
