name: Compilar APK Capacitor
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Preparar archivos web y Configuracion
        run: |
          mkdir -p www
          rsync -a --exclude='www' --exclude='node_modules' --exclude='.github' --exclude='android' --exclude='.*' ./ www/
          echo '{ "appId": "com.pablo.picoos", "appName": "Pico OS", "webDir": "www", "bundledWebRuntime": false }' > capacitor.config.json

      - name: Instalar dependencias
        run: npm install

      - name: Crear plataforma Android
        run: npx cap add android || true

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK nativo
        working-directory: ./android
        run: chmod +x ./gradlew && ./gradlew assembleDebug

      - name: Entregar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
